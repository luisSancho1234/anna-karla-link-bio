<div class="relative h-dvh overflow-hidden">
  <!-- Fundo -->
  <img
    src="assets/img/bg-image.webp"
    class="absolute inset-0 h-full w-full sm:ml-0 md:ml-20 lg:ml-40 object-cover mix-blend-color-burn opacity-20 pointer-events-none"
  />

  <!-- Conteúdo -->
  <div class="relative z-10 py-8">
    <img class="mx-auto w-full max-w-70 sm:max-w-86" src="assets/img/photo-frame.webp" />
    <img class="mx-auto w-full max-w-80 sm:max-w-96" src="assets/img/title.webp" />
  </div>

  <div class="flex w-full justify-center items-center mt-2 gap-2">
    @for (item of links; track item.image) {
      <a [href]="item.url" target="_blank" class="relative group">
        <!-- Glow -->
        <div
          class="absolute left-6 top-3 -translate-x-1/2 -translate-y-1/3 h-10 w-10 rounded-full bg-[#ec8c08] blur-lg opacity-90 transition-all group-hover:scale-125 group-hover:opacity-100 z-20"
        ></div>

        <img
          class="relative z-10 w-20 transition-transform duration-300 group-hover:scale-105"
          [src]="'assets/img/' + item.image"
        />
      </a>
    }
  </div>
  <div class="flex mt-6 gap-3 items-center justify-center">
    <img class="w-6 sm:w-8 mb-1" src="assets/img/touch-icon.webp" />
    <p class="text-white sm:text-xl text-md font-semibold">TOQUE PARA ENTRAR EM CONTATO</p>
  </div>
  <img class="absolute bottom-0 left-0 w-full max-h-5 z-10" src="assets/img/footer.webp" />
</div>
